<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSLAN</title>
    <link rel="icon" type="image/ico" href="images/favicon.ico">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/jeux.css">
    <link rel="canonical" href="https://tslan.fr/" />
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop>
            <source src="/videos/background.webm" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="overlay"></div>
    </div>
    <nav>
        <div class="nav-inner">
            <ul class="nav-links">
                <li><a href="/">Accueil</a></li>
                <li><a href="/public">Public</a></li>
                <li><a href="/participation">Participation</a></li>
                <li><a href="/planning">Planning</a></li>
                <li><a class="active" href="/jeux">Jeux</a></li>
                <li><a href="/archives">Archives</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <section class="hero-panel">
            <div class="hero-card">
                <h1>Jeux de la TSLAN 2k26</h1>

                <div class="games-grid">
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/league_of_legends.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/league_of_legends.webp" alt="League of Legends">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/counter_strike_2.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/counter_strike_2.webp" alt="Counter Strike 2">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/minecraft.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/minecraft.webp" alt="Minecraft">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/trackmania.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/trackmania.webp" alt="Trackmania">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/just_dance.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/just_dance.webp" alt="Just Dance">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/left_4_dead_2.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/left_4_dead_2.webp" alt="Left 4 Dead 2">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/gang_beast.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/gang_beasts.webp" alt="Gang Beasts">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/silksong.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/silksong.webp" alt="Silksong">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/the_finals.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/the_finals.webp" alt="The Finals">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <video class="card-video" src="/videos/game_trailer/rocket_league.webm" loop muted playsinline></video>
                        <img class="card-img" src="/images/2026_jeux/rocket_league.webp" alt="Rocket League">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card">
                        <img src="/images/2026_jeux/quiz.webp" alt="Quiz">
                    </div>
                    <div class="card">
                        <img src="/images/2026_jeux/jeu_mystère.webp" alt="Jeu Mystère">
                    </div>    
                </div>
            </div>

        </section>
    </main>
    <footer>
        <div class="footer-links">
            <a href="/mentions-legales" >Mentions légales</a>
        </div>
        <p>TSLAN — Games On The Stage</p>
    </footer>
    <script src="/js/jeux.js" defer></script>
</body>
</html>
